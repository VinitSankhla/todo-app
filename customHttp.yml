# Security headers served by Amplify Hosting for every response.
# https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
# The Content-Security-Policy only allows this site's own files plus the Cognito and AppSync
# endpoints in ap-south-1. If you change region or add AWS services, update connect-src.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self';
          img-src 'self' data:;
          font-src 'self';
          connect-src 'self' https://cognito-idp.ap-south-1.amazonaws.com https://cognito-identity.ap-south-1.amazonaws.com https://*.appsync-api.ap-south-1.amazonaws.com;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none'
