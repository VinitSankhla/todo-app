name: CI

on:
  push:
  pull_request:

# Read-only token: this workflow never writes to the repo and needs no AWS access.
permissions:
  contents: read

# Cancel an older run on the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci can wrongly reject a valid lock file when a package bundled inside an Amplify/CDK
      # package gets a new release ("lock file's X does not satisfy X"). Fall back to npm install,
      # which installs the same locked versions, and say so in the log.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning::npm ci rejected the lock file (known npm issue with bundled dependencies); falling back to npm install"
            npm install --no-audit --no-fund
          }

      # amplify_outputs.json is git-ignored; type-check and build need a placeholder.
      - name: Create placeholder amplify_outputs.json
        run: npm run amplify:placeholder

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
