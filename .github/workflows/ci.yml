name: CI

on:
  push:
  pull_request:

# Read-only token: this workflow never writes to the repo and needs no AWS access.
permissions:
  contents: read

# Cancel an older run on the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # amplify_outputs.json is git-ignored; type-check and build need a placeholder.
      - name: Create placeholder amplify_outputs.json
        run: npm run amplify:placeholder

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
